<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>웹 푸시 알림 설정</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 2rem 1.5rem; max-width: 480px; margin: 0 auto; }
  button { width: 100%; padding: 0.9rem; font-size: 1rem; border-radius: 0.5rem; border: 1px solid #ccc; background: #1f77b4; color: white; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  #status { margin-top: 1rem; font-size: 0.9rem; color: #444; white-space: pre-wrap; }
</style>
</head>
<body>
  <h2>🔔 탭 닫아도 오는 알림 켜기</h2>
  <p>이 페이지는 독립된 페이지라서 서비스워커 등록이 iframe 제약 없이 정상 동작합니다.</p>
  <button id="btn">알림 켜기</button>
  <div id="status"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const vapidPublicKey = params.get("vapid");
    const leaveTime = params.get("leave");
    const backUrl = params.get("back"); // 메인 앱으로 돌아갈 URL(쿼리 파라미터 없는 base)

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("btn");
    const setStatus = (msg) => { statusEl.textContent = msg; };

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
    }

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        if (!vapidPublicKey || !leaveTime || !backUrl) {
          setStatus("잘못된 접근입니다 (필수 파라미터 누락). 앱에서 다시 버튼을 눌러주세요.");
          return;
        }
        if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
          setStatus("이 브라우저는 웹 푸시를 지원하지 않습니다.");
          return;
        }

        setStatus("알림 권한 요청 중...");
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          setStatus("알림 권한이 거부됐습니다.");
          btn.disabled = false;
          return;
        }

        setStatus("서비스워커 등록 중...");
        const registration = await navigator.serviceWorker.register("/app/static/service-worker.js");
        await navigator.serviceWorker.ready;

        setStatus("구독 생성 중...");
        let subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(vapidPublicKey),
          });
        }

        setStatus("구독 완료! 앱으로 돌아가는 중...");
        const payload = btoa(JSON.stringify(subscription.toJSON()));
        const redirectUrl = new URL(backUrl);
        redirectUrl.searchParams.set("push_sub", payload);
        redirectUrl.searchParams.set("push_leave", leaveTime);
        location.href = redirectUrl.toString();
      } catch (e) {
        console.error("웹 푸시 구독 실패:", e);
        setStatus("실패: " + e.name + " - " + e.message);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
