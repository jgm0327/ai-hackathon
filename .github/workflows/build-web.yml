name: build-web

# 프론트엔드 빌드를 배포 VM 밖으로 빼기 위한 워크플로 (9/18 신설).
#
# 왜: 배포 VM이 OCI AMD Micro(RAM 977MB)다. 유휴 상태에서 available이 380MB 남짓인데
# `next build` 피크가 그걸 훌쩍 넘어서, 스왑(이미 4GB 붙어 있음)에 페이징하며 기어간다.
# 같은 빌드가 개발 노트북에서는 12초에 끝난다. 스왑을 더 늘려도 더 느려질 뿐이라
# **그 머신에서 빌드를 안 하는 것**이 유일한 해법이다.
#
# 여기서 만든 tarball을 `web-latest` 릴리스에 올려두면, VM은 `deploy/update-web.sh`로
# 받아서 풀고 systemd만 재시작한다 — VM에 npm도 node_modules도 필요 없어진다.
#
# 러너가 ubuntu-latest라 VM과 플랫폼이 같다. (개발 노트북(Windows)에서 빌드해 올리면
# `@next/swc-win32-*` 같은 플랫폼별 네이티브 바이너리가 섞여 들어갈 수 있어서 안 된다.)
#
# 저장소가 public이라 VM은 토큰 없이 curl로 받을 수 있다. private으로 바꾸면
# 다운로드에 인증이 필요해지므로 update-web.sh도 같이 고쳐야 한다.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/build-web.yml"
  workflow_dispatch: {}

# gh release 생성/업로드에 필요. 그 외 권한은 주지 않는다.
permissions:
  contents: write

# 같은 브랜치에 연달아 푸시하면 앞 빌드는 취소한다 — 릴리스 자산이 한 개(web-latest)라
# 동시에 두 빌드가 업로드하면 어느 게 남는지 알 수 없다.
concurrency:
  group: build-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # VM에 깔린 Node와 메이저를 맞춘다 (DEPLOY 운영 노트 1-4: Next 16은 >= 20.9).
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 의존성 설치
        working-directory: web
        run: npm ci

      # VM에서 빌드할 땐 사람이 로컬에서 lint를 돌리고 올렸다. 빌드가 CI로 옮겨온 이상
      # 검증도 같이 와야 한다 — 타입체크는 next build가 이미 수행한다.
      - name: Lint
        working-directory: web
        run: npm run lint

      - name: 빌드
        working-directory: web
        env:
          # 같은 도메인에서 nginx가 /api를 FastAPI로 프록시하는 구성 — 이 값은 빌드
          # 시점에 번들에 박히므로 여기서 명시한다 (web/.env.local.example 참고).
          NEXT_PUBLIC_API_BASE: /api
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      # standalone은 서버와 추려낸 node_modules만 담는다. 정적 자산(.next/static)과
      # public/은 Next가 일부러 복사하지 않으므로(배포 시 CDN에 얹는 구성을 고려한 설계)
      # 여기서 직접 넣어줘야 한다. 빠뜨리면 페이지는 뜨는데 CSS/JS가 404 난다.
      - name: 산출물 묶기
        working-directory: web
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          # VM이 "지금 돌고 있는 게 어느 커밋인지" 확인할 수 있게 남긴다.
          cat > .next/standalone/BUILD_INFO <<EOF
          commit=${GITHUB_SHA}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          tar -czf "${GITHUB_WORKSPACE}/web-build.tar.gz" -C .next/standalone .
          ls -lh "${GITHUB_WORKSPACE}/web-build.tar.gz"

      # 태그를 고정(web-latest)해서 VM이 항상 같은 URL을 받게 한다. 릴리스를 지웠다
      # 다시 만들지 않고 자산만 덮어써서(--clobber) 다운로드가 비는 순간을 줄인다.
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view web-latest >/dev/null 2>&1 || \
            gh release create web-latest \
              --title "web build (prebuilt)" \
              --notes "배포 VM이 받아가는 Next.js standalone 빌드. deploy/update-web.sh 참고." \
              --latest=false
          gh release upload web-latest web-build.tar.gz --clobber
