name: send-reminder

# 구독 데이터는 Upstash Redis(REST API)에 저장한다 (9/10) — 배포된 Streamlit 앱(쓰기)과
# 이 워크플로(읽기)가 서로 다른 프로세스라 파일시스템을 공유 못 하기 때문.
# src/push/subscription_store.py 참고. Repo Secrets에 UPSTASH_REDIS_REST_URL/TOKEN 필요.

on:
  schedule:
    - cron: "*/5 * * * *"  # 5분마다 실행, send_due_reminders()의 window_minutes와 맞출 것
  workflow_dispatch: {}  # 수동 테스트용

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Send due reminders
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.VAPID_CONTACT_EMAIL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python -c "from src.push.push_sender import send_due_reminders; send_due_reminders()"
